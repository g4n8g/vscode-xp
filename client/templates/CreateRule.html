<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">

	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link rel="stylesheet" href="{{{extensionBaseUri}}}/client/templates/styles/new_rule.css">
	
</head>
	<body>
		<h3>{{{CreateNewRule}}}</h3>
		<table>
			<tr>
				<td class="labels">{{{NameLabel}}}</td>
				<td class="userinput">
					<input id="Name" type="text" pattern="[A-Za-z0-9_]+" required autofocus>
				</td>
			</tr>
			<tr>
				<td class="labels">{{Template}}</td>
				<td class="userinput">
					<select id="TemplateType">
						{{#templateNames}}
						<option value="{{.}}">{{.}}</option>
						{{/templateNames}}
					</select>
					<input id="Path" type="hidden" value="{{ruleFullPath}}">
				</td>
			</tr>
		</table>

		<input name="saveOptions" onclick="createCorrelation()" type="submit" value="{{Create}}">
	</body>

	<script>
		const vscode = acquireVsCodeApi();
		const nameInput = document.getElementById("Name");

		function updateNameValidity(showEmptyError = false) {
			const shouldShowError = !nameInput.validity.valid && (showEmptyError || nameInput.value.length > 0);
			nameInput.classList.toggle("name-invalid", shouldShowError);
		}

		nameInput.addEventListener("input", () => updateNameValidity());
		nameInput.addEventListener("blur", () => updateNameValidity(true));
		
		function createCorrelation() {
			updateNameValidity(true);
			if (!nameInput.reportValidity()) {
				return;
			}

			const name = nameInput.value;
			const type = document.getElementById("TemplateType").value;
			const path = document.getElementById("Path").value;
			
			vscode.postMessage({
				command: '{{{commandName}}}',
				rule: {
					'Name' : name,
					'Path' : path,
					'TemplateType' : type,
				}
			});
		}
	</script>
</html>
